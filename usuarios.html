<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuarios</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<h1>Lista de Usuarios</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Usuario</th>
    </tr>

    <tr th:each="u : ${listaUsuarios}">
        <td th:text="${u.id_usuario}"></td>
        <td th:text="${u.username}"></td>
    </tr>
</table>

</body>
</html>
